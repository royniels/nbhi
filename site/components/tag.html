<span nb-text="label"></span>
<button type="button" nb-ref="remove" aria-label="Remove">×</button>

<style>
  :host {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin: 0 8px 8px 0;
    padding: 0 4px 0 12px;
    background: var(--sea-soft);
    color: var(--ink);
    border: 2px solid var(--line);
    border-radius: var(--wobbly);
    font-size: 1.1rem;
  }

  button {
    font: inherit;
    line-height: 1;
    width: 24px;
    height: 24px;
    border: none;
    border-radius: 50%;
    color: var(--ink);
    background: transparent;
    cursor: pointer;
  }

  button:hover {
    background: var(--error);
    color: #fff;
  }
</style>

<script type="module">
  export default element => {
    element.refs.remove.addEventListener('click', () => {
      element.dispatchEvent(new CustomEvent('remove', { bubbles: true, detail: { label: element.label } }));
    });
  };
</script>
